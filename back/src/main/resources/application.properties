spring.application.name=carros-classicos

# H2 em memória
spring.datasource.url=jdbc:h2:mem:carrosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Cache próprio (implementado com ConcurrentHashMap)
app.cache.max-itens=5
app.cache.ttl-segundos=60
app.cache.politica=LRU
app.cache.limpeza-intervalo-ms=30000

# Lentidão artificial da fonte (banco), em milissegundos
app.fonte.atraso-ms=2000

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.paths-to-match=/carros/**,/cache/**
